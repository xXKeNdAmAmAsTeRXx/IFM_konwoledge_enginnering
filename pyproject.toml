[project]
name = "ifm-konwoledge-enginnering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "frkubala@student.agh.edu.pl" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "packaging>=26.3",
    "pytest>=9.1.1",
    "seaborn>=0.13.2",
    "unified-planning[fast-downward,pyperplan]>=1.3.0",
    "z3>=0.2.0",
]

[project.scripts]
ifm-konwoledge-enginnering = "ifm_konwoledge_enginnering:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "pytest>=9.1.1",
]
